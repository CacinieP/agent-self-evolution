name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验论文 README 模板
        run: python scripts/check_papers.py

      - name: 校验原型 mock 可运行
        run: python scripts/check_prototypes.py

      - name: 校验 Markdown 链接有效性
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".markdown-link-check.json"
          folder-path: "surveys/papers,docs,practices"
          max-depth: 2
