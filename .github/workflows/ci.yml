name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验论文 README 模板
        run: python scripts/check_papers.py

      - name: 校验原型 mock 可运行
        run: python scripts/check_prototypes.py

      - name: 原型回归测试
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: 校验内部相对链接(全仓)
        run: |
          python - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path(".")
          broken = []
          for md in root.rglob("*.md"):
              for m in re.finditer(r'\[[^\]]+\]\(([^)]+)\)', md.read_text(encoding="utf-8")):
                  t = m.group(1).split("#")[0].split("?")[0].strip()
                  if not t or t.startswith(("http","#","mailto:")): continue
                  if not (md.parent / t).resolve().exists():
                      broken.append(f"{md.relative_to(root)} -> {t}")
          if broken:
              print("❌ 内部断链:"); [print(" ", b) for b in sorted(set(broken))]; sys.exit(1)
          print(f"✅ 内部相对链接全部有效(扫描 {sum(1 for _ in root.rglob('*.md'))} 个 md)")
          PY

      - name: 校验外部 Markdown 链接有效性
        uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".markdown-link-check.json"
          folder-path: "surveys/papers,docs,practices"
          file-path: "README.md,CONTRIBUTING.md"
          max-depth: 2
